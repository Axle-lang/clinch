name: CI

# Every push to `dev` or `main`, and every pull request aimed at either.
#
#   checks   the portable half — parsing, suggestions, help, configuration, output — runs as Python
#            (tools/axpy) over the translated sources, beside the checker for layers, ports and seams;
#   windows  the compiler's word for the Windows target, and the example built and run;
#   linux    the same for the Linux target.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The compiler these sources need. The installers serve whatever is current, so the jobs check instead
  # of assuming: an older `axle` fails with one clear line rather than a hundred confusing ones.
  AXLE_MIN: '0.18.0'
  # The compiler's diagnostics are read in this log; colour codes only get in the way.
  NO_COLOR: '1'

jobs:
  checks:
    name: Checks (portable half)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The translator keeps its simulated heap in numpy.
      - run: pip install numpy
      - name: Layers, ports, seams, names
        run: python3 tools/check.py
      - name: The checker rejects what it should
        run: python3 tools/check.py --selftest
      - name: lib.axle names every module
        run: python3 tools/gen_lib.py --check
      - name: The portable logic, run
        run: |
          for t in core; do
            echo "── $t"
            python3 tools/axpy/test_$t.py | tail -3
          done

  windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Install Axle
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'axle.msi'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://dl.axle-lang.dev/latest/axle-windows-x86_64.msi' -OutFile $msi
          $p = Start-Process msiexec.exe -Wait -PassThru `
            -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart'
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
          $dir = $null
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Axle', 'HKLM:\SOFTWARE\Axle') {
            if (-not $dir -and (Test-Path $k)) {
              $dir = (Get-ItemProperty $k -Name InstallDir -ErrorAction SilentlyContinue).InstallDir
            }
          }
          foreach ($c in 'C:\Program Files (x86)\Axle', 'C:\Program Files\Axle') {
            if (-not $dir -and (Test-Path (Join-Path $c 'axle.exe'))) { $dir = $c }
          }
          if (-not $dir) { throw 'the MSI installed, but axle.exe was not found' }
          Add-Content -Path $env:GITHUB_PATH -Value $dir.TrimEnd('\')
          if (-not (Get-Command lld-link.exe -ErrorAction SilentlyContinue)) {
            throw 'lld-link.exe is not on PATH; axle cannot link a Windows binary without it (install LLVM)'
          }

      - name: Check the compiler is new enough
        shell: pwsh
        run: |
          $got = (((& axle --version) -split ' ')[1] -split '-')[0]
          if ([version]$got -lt [version]$env:AXLE_MIN) { throw "axle $got is older than the required $env:AXLE_MIN" }
          "axle $got satisfies >= $env:AXLE_MIN"

      - uses: actions/checkout@v4

      - name: The port this build resolves
        run: axle ports

      - name: Build the example
        working-directory: examples/hello
        run: axle build

      - name: Run the example
        working-directory: examples/hello
        run: |
          ./target/hello.exe serve --port 9000 site
          ./target/hello.exe --version
          ./target/hello.exe serve --prot 1 site; if ($LASTEXITCODE -ne 2) { throw "expected status 2, got $LASTEXITCODE" }

      - name: The port this build resolves
        run: axle ports

      - name: The compiler's word for the Linux target
        working-directory: examples/hello
        run: axle check --target x86_64-unknown-linux-gnu

      - name: Build the example
        working-directory: examples/hello
        run: axle build

      - name: Run the example
        working-directory: examples/hello
        run: |
          ./target/hello serve --port 9000 site
          ./target/hello --version
          status=0; ./target/hello serve --prot 1 site || status=$?
          test "$status" = 2

  linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Install Axle
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://apt.axle-lang.dev/key.asc | sudo gpg --dearmor -o /etc/apt/keyrings/axle.gpg
          echo "deb [signed-by=/etc/apt/keyrings/axle.gpg arch=amd64] https://apt.axle-lang.dev stable main" \
            | sudo tee /etc/apt/sources.list.d/axle.list
          sudo apt-get update
          sudo apt-get install -y axle

      - name: Check the compiler is new enough
        run: |
          got=$(axle --version | awk '{print $2}' | cut -d- -f1)
          if [ "$(printf '%s\n%s\n' "$AXLE_MIN" "$got" | sort -V | head -n1)" != "$AXLE_MIN" ]; then
            echo "axle $got is older than the required $AXLE_MIN"; exit 1
          fi
          echo "axle $got satisfies >= $AXLE_MIN"

      - uses: actions/checkout@v4

      - name: The port this build resolves
        run: axle ports

      - name: The compiler's word for the Linux target
        working-directory: examples/hello
        run: axle check --target x86_64-unknown-linux-gnu

      - name: Build the example
        working-directory: examples/hello
        run: axle build

      - name: Run the example
        working-directory: examples/hello
        run: |
          ./target/hello serve --port 9000 site
          ./target/hello --version
          status=0; ./target/hello serve --prot 1 site || status=$?
          test "$status" = 2
