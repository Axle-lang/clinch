name: CI

# Every push to `dev` or `main`, and every pull request aimed at either: the sources are formatted, the checks
# pass, and the example runs, on Windows and on Linux, with the compiler.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: '1'

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Axle
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://apt.axle-lang.dev/key.asc | sudo gpg --dearmor -o /etc/apt/keyrings/axle.gpg
          echo "deb [signed-by=/etc/apt/keyrings/axle.gpg arch=amd64] https://apt.axle-lang.dev stable main" \
            | sudo tee /etc/apt/sources.list.d/axle.list
          sudo apt-get update
          sudo apt-get install -y axle
      - name: Formatted
        run: axle fmt --check src
      - name: Checks
        working-directory: tests
        run: axle build && ./target/tests
      - name: Example
        working-directory: examples/hello
        run: |
          axle build
          ./target/hello serve --port 9000 site
          ./target/hello --version
          ./target/hello serve --help
          status=0; ./target/hello serve --prot 1 site || status=$?
          test "$status" = 2

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Axle
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'axle.msi'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://dl.axle-lang.dev/latest/axle-windows-x86_64.msi' -OutFile $msi
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart'
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
          $dir = $null
          foreach ($k in 'HKLM:\SOFTWARE\WOW6432Node\Axle', 'HKLM:\SOFTWARE\Axle') {
            if (-not $dir -and (Test-Path $k)) {
              $dir = (Get-ItemProperty $k -Name InstallDir -ErrorAction SilentlyContinue).InstallDir
            }
          }
          foreach ($c in 'C:\Program Files (x86)\Axle', 'C:\Program Files\Axle') {
            if (-not $dir -and (Test-Path (Join-Path $c 'axle.exe'))) { $dir = $c }
          }
          if (-not $dir) { throw 'the MSI installed, but axle.exe was not found' }
          Add-Content -Path $env:GITHUB_PATH -Value $dir.TrimEnd('\')
      - name: Checks
        working-directory: tests
        run: |
          axle build
          ./target/tests.exe
          if ($LASTEXITCODE -ne 0) { throw "checks failed: $LASTEXITCODE" }
      - name: Example
        working-directory: examples/hello
        run: |
          axle build
          ./target/hello.exe serve --port 9000 site
          ./target/hello.exe --version
          ./target/hello.exe serve --help
          ./target/hello.exe serve --prot 1 site
          # The usage error is the expected outcome: status 2.
          if ($LASTEXITCODE -ne 2) { throw "expected status 2, got $LASTEXITCODE" }
          exit 0
