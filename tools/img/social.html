<!doctype html><meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 640px; overflow: hidden; }
body { background: #12121c; color: #e8e6f2; font-family: "Inter", "Segoe UI", "DejaVu Sans", system-ui, sans-serif; position: relative; }
.glow { position: absolute; width: 900px; height: 900px; right: -300px; top: -380px; background: radial-gradient(closest-side, rgba(110,94,255,.38), rgba(110,94,255,0)); }
.glow2 { position: absolute; width: 700px; height: 700px; left: -300px; bottom: -420px; background: radial-gradient(closest-side, rgba(255,122,69,.18), rgba(255,122,69,0)); }
.left { position: absolute; left: 80px; top: 84px; width: 640px; }
.eyebrow { font-size: 20px; letter-spacing: .22em; text-transform: uppercase; color: #9a96c4; font-weight: 600; }
h1 { font-size: 148px; line-height: 1.18; padding-bottom: 6px; letter-spacing: -.04em; font-weight: 800; margin: 10px 0 8px -6px; background: linear-gradient(90deg,#fff 20%,#a79fff); -webkit-background-clip: text; color: transparent; }
.tag { font-size: 31px; line-height: 1.32; color: #cfcce8; font-weight: 500; }
.tag b { color: #fff; font-weight: 700; }
.chips { position: absolute; left: 80px; bottom: 70px; display: flex; gap: 12px; }
.chip { padding: 10px 18px; border-radius: 999px; font-size: 20px; font-weight: 600; background: #1b1b2b; border: 1px solid #2c2c44; color: #d8d5ee; }
.chip.w { background: #5B4BE1; border-color: #5B4BE1; color: #fff; }
.term { position: absolute; right: 70px; top: 96px; width: 470px; border-radius: 18px; background: #161624; border: 1px solid #2c2c44; padding: 22px 26px 24px; font-family: "DejaVu Sans Mono", monospace; font-size: 20px; line-height: 1.6; }
.dots { display:flex; gap:8px; margin-bottom: 14px } .dots i { width: 12px; height:12px; border-radius:99px; background:#2c2c44 }
.term div { white-space: pre; }
.p { color:#7fd6a0 } .e { color:#ff9d7a } .h { color:#f0c95a } .d { color:#7f7ba8 }
.url { position: absolute; right: 70px; bottom: 28px; font-size: 20px; color: #7f7ba8; font-family: "DejaVu Sans Mono", monospace; }
</style>
<div class="glow"></div><div class="glow2"></div>
<div class="left">
  <div class="eyebrow">Axle · command-line framework</div>
  <h1>clinch</h1>
  <div class="tag">The command line of an Axle program, <b>declared once</b>. Typos that get corrected.</div>
</div>
<div class="term">
  <div class="dots"><i></i><i></i><i></i></div>
  <div><span class="p">$</span> tool serve --prot 80</div>
  <div class="e">error: unknown option `--prot`</div>
  <div class="h">  did you mean `--port`?</div>
  <div class="d">$ echo $?</div>
  <div>2</div>
</div>
<div class="chips"><span class="chip">Subcommands</span><span class="chip">Typed options</span><span class="chip">Did you mean…</span><span class="chip w">Windows · Linux</span></div>
<div class="url">github.com/Axle-lang/clinch</div>
